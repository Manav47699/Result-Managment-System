{% extends 'base.html' %}

{% block title %}Update Result - SRMS{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow-lg p-6 max-w-2xl mx-auto">
    <h2 class="text-3xl font-bold text-gray-800 mb-6">Update Result</h2>
    
    <div class="bg-blue-50 p-4 rounded mb-4">
        <p><strong>Student:</strong> {{ result.student_name }}</p>
        <p><strong>Course:</strong> {{ result.course_name }}</p>
    </div>
    
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label for="subject_name" class="block text-sm font-medium text-gray-700 mb-2">Subject Name *</label>
            <input 
                type="text" 
                name="subject_name" 
                id="subject_name"
                value="{{ result.subject_name }}"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
            >
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="marks_obtained" class="block text-sm font-medium text-gray-700 mb-2">Marks Obtained *</label>
                <input 
                    type="number" 
                    name="marks_obtained" 
                    id="marks_obtained"
                    value="{{ result.marks_obtained }}"
                    required
                    min="0"
                    step="0.01"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                >
            </div>
            
            <div>
                <label for="total_marks" class="block text-sm font-medium text-gray-700 mb-2">Total Marks *</label>
                <input 
                    type="number" 
                    name="total_marks" 
                    id="total_marks"
                    value="{{ result.total_marks }}"
                    required
                    min="1"
                    step="0.01"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                >
            </div>
        </div>
        
        <div>
            <label for="exam_date" class="block text-sm font-medium text-gray-700 mb-2">Exam Date</label>
            <input 
                type="date" 
                name="exam_date" 
                id="exam_date"
                value="{{ result.exam_date|date:'Y-m-d' }}"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
            >
        </div>
        
        <div>
            <label for="remarks" class="block text-sm font-medium text-gray-700 mb-2">Remarks</label>
            <textarea 
                name="remarks" 
                id="remarks"
                rows="3"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
            >{{ result.remarks }}</textarea>
        </div>
        
        <div class="flex gap-4 pt-4">
            <button 
                type="submit" 
                class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition"
            >
                Update Result
            </button>
            <a 
                href="{% url 'result_list' %}" 
                class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 rounded-lg transition text-center"
            >
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
