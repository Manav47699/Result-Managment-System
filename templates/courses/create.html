{% extends 'base.html' %}

{% block title %}Add Course - SRMS{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow-lg p-6 max-w-2xl mx-auto">
    <h2 class="text-3xl font-bold text-gray-800 mb-6">Add New Course</h2>
    
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Course Name *</label>
                <input 
                    type="text" 
                    name="name" 
                    id="name"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500"
                    placeholder="Enter course name"
                >
            </div>
            
            <div>
                <label for="code" class="block text-sm font-medium text-gray-700 mb-2">Course Code *</label>
                <input 
                    type="text" 
                    name="code" 
                    id="code"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500"
                    placeholder="e.g., CS101"
                >
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="duration" class="block text-sm font-medium text-gray-700 mb-2">Duration (months) *</label>
                <input 
                    type="number" 
                    name="duration" 
                    id="duration"
                    required
                    min="1"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500"
                    placeholder="Enter duration"
                >
            </div>
            
            <div>
                <label for="fee" class="block text-sm font-medium text-gray-700 mb-2">Fee *</label>
                <input 
                    type="number" 
                    name="fee" 
                    id="fee"
                    required
                    min="0"
                    step="0.01"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500"
                    placeholder="Enter fee"
                >
            </div>
        </div>
        
        <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
            <textarea 
                name="description" 
                id="description"
                rows="4"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500"
                placeholder="Enter course description"
            ></textarea>
        </div>
        
        <div class="flex gap-4 pt-4">
            <button 
                type="submit" 
                class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition"
            >
                Create Course
            </button>
            <a 
                href="{% url 'course_list' %}" 
                class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 rounded-lg transition text-center"
            >
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
